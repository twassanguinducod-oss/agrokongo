<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14532d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fundo -->
  <rect width="512" height="512" rx="100" fill="url(#grad1)"/>
  
  <!-- Ícone de folha (representando agricultura) -->
  <g transform="translate(256, 256)">
    <!-- Folha principal -->
    <path d="M 0,-130 Q 80,-80 80,0 Q 80,80 0,130 Q -80,80 -80,0 Q -80,-80 0,-130" 
          fill="none" stroke="white" stroke-width="20" opacity="0.9"/>
    
    <!-- Veia central -->
    <line x1="0" y1="-120" x2="0" y2="120" stroke="white" stroke-width="10" opacity="0.7"/>
    
    <!-- Veias laterais -->
    <line x1="-40" y1="-55" x2="-70" y2="-30" stroke="white" stroke-width="8" opacity="0.6"/>
    <line x1="40" y1="-55" x2="70" y2="-30" stroke="white" stroke-width="8" opacity="0.6"/>
    <line x1="-55" y1="0" x2="-85" y2="0" stroke="white" stroke-width="8" opacity="0.6"/>
    <line x1="55" y1="0" x2="85" y2="0" stroke="white" stroke-width="8" opacity="0.6"/>
    <line x1="-40" y1="55" x2="-70" y2="30" stroke="white" stroke-width="8" opacity="0.6"/>
    <line x1="40" y1="55" x2="70" y2="30" stroke="white" stroke-width="8" opacity="0.6"/>
    
    <!-- Círculo central -->
    <circle cx="0" cy="0" r="40" fill="white" opacity="0.3"/>
  </g>
  
  <!-- Texto "AK" -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="64" font-weight="bold" 
        fill="white" text-anchor="middle" opacity="0.8">AK</text>
</svg>
