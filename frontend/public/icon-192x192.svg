<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a34a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14532d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fundo -->
  <rect width="192" height="192" rx="40" fill="url(#grad1)"/>
  
  <!-- Ícone de folha (representando agricultura) -->
  <g transform="translate(96, 96)">
    <!-- Folha principal -->
    <path d="M 0,-50 Q 30,-30 30,0 Q 30,30 0,50 Q -30,30 -30,0 Q -30,-30 0,-50" 
          fill="none" stroke="white" stroke-width="8" opacity="0.9"/>
    
    <!-- Veia central -->
    <line x1="0" y1="-45" x2="0" y2="45" stroke="white" stroke-width="4" opacity="0.7"/>
    
    <!-- Veias laterais -->
    <line x1="-15" y1="-20" x2="-25" y2="-10" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="15" y1="-20" x2="25" y2="-10" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="-20" y1="0" x2="-30" y2="0" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="20" y1="0" x2="30" y2="0" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="-15" y1="20" x2="-25" y2="10" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="15" y1="20" x2="25" y2="10" stroke="white" stroke-width="3" opacity="0.6"/>
    
    <!-- Círculo central -->
    <circle cx="0" cy="0" r="15" fill="white" opacity="0.3"/>
  </g>
  
  <!-- Texto "AK" -->
  <text x="96" y="165" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        fill="white" text-anchor="middle" opacity="0.8">AK</text>
</svg>
