# docker-compose.yml
version: '3.8'

services:
  # ===========================================
  # DATABASE (PostgreSQL)
  # ===========================================
  db:
    image: postgres:15-alpine
    container_name: agrokongo_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: agrokongo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MessiKi@my010822
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # REDIS (Cache + Celery Broker)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: agrokongo_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # DJANGO APP
  # ===========================================
  web:
    build: .
    container_name: agrokongo_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput --clear &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 agrokongo.wsgi:application"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=django-insecure-pe(s6_*+4d+=%di1c%7k#(iuu)g#lm3r7c0!xr65oq8!cqet_q
      - DB_NAME=agrokongo_db
      - DB_USER=postgres
      - DB_PASSWORD=MessiKi@my010822
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===========================================
  # CELERY WORKER
  # ===========================================
  celery:
    build: .
    container_name: agrokongo_celery
    command: celery -A agrokongo worker --loglevel=info
    volumes:
      - .:/app
      - media_volume:/app/media
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=django-insecure-pe(s6_*+4d+=%di1c%7k#(iuu)g#lm3r7c0!xr65oq8!cqet_q
      - DB_NAME=agrokongo_db
      - DB_USER=postgres
      - DB_PASSWORD=MessiKi@my010822
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - web
      - redis

  # ===========================================
  # CELERY BEAT (Tarefas Agendadas)
  # ===========================================
  celery-beat:
    build: .
    container_name: agrokongo_celery_beat
    command: celery -A agrokongo beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=django-insecure-pe(s6_*+4d+=%di1c%7k#(iuu)g#lm3r7c0!xr65oq8!cqet_q
      - DB_NAME=agrokongo_db
      - DB_USER=postgres
      - DB_PASSWORD=MessiKi@my010822
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - web
      - redis

volumes:
  postgres_data:
  static_volume:
  media_volume:
  logs_volume: